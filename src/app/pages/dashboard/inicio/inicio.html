<section class="w-full h-full flex flex-col gap-5">
  <div class="flex flex-col">
    <span class="text-brand-blue-300 text-sm font-bold">CONSULTA PÚBLICA / PARKCONTROL</span>
    <h1 class="text-3xl">Disponibilidad detallada</h1>
  </div>
  <div class="w-full flex flex-col">
    <div class="flex flex-1 gap-5 justify-between">
      <div class="flex flex-1 flex-col gap-3 p-5 bg-brand-blue-400 rounded-xl justify-center text-white">
        <span>Plazas libres</span>
        <span class="text-4xl">{{ plazasMax() - plazas() }} / {{ plazasMax() }}</span>
      </div>
      <div class="flex flex-1 flex-col gap-3 p-5 bg-white rounded-xl justify-center text-white">
        <span class="text-brand-gray-400">Ocupadas</span>
        <span class="text-4xl text-black">{{ plazas() }} / {{ plazasMax() }}</span>
      </div>
      <div class="flex flex-1 flex-col gap-3 p-5 bg-white rounded-xl justify-center text-white">
        <span class="text-brand-gray-400">Mantenimiento</span>
        <span class="text-4xl text-black">{{ plazasBloqueadas() }}</span>
      </div>
    </div>
  </div>
</section>
