<div class="flex min-h-[calc(100dvh-80px)]"> <!-- Ajusta 80px a la altura de tu header -->

  <!-- MENÚ LATERAL -->
  <aside class="w-64 bg-white shadow-md p-4 border-r border-gray-200">
    <h2 class="text-lg font-bold mb-6 text-gray-800">Panel de Gestión</h2>

    <nav class="flex flex-col gap-2">

      <!-- OPCIONES DE ABONADO (todos los roles las ven) -->
      <a routerLink="/dashboard/mis-tickets" routerLinkActive="bg-blue-100 text-blue-700 font-semibold" class="p-2 rounded hover:bg-gray-100 transition-colors">
        Mis Tickets
      </a>
      <a routerLink="/dashboard/mi-abono" routerLinkActive="bg-blue-100 text-blue-700 font-semibold" class="p-2 rounded hover:bg-gray-100 transition-colors">
        Mi Abono
      </a>

      <!-- OPCIONES DE OPERADOR (OPERADOR y ADMIN) -->
      @if (auth.tieneRol('OPERADOR', 'ADMIN')) {
        <div class="mt-4 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">Operaciones</div>
        <a routerLink="/dashboard/plazas" routerLinkActive="bg-blue-100 text-blue-700 font-semibold" class="p-2 rounded hover:bg-gray-100 transition-colors">
          Gestión de Plazas
        </a>
        <a routerLink="/dashboard/tickets" routerLinkActive="bg-blue-100 text-blue-700 font-semibold" class="p-2 rounded hover:bg-gray-100 transition-colors">
          Cobro de Tickets
        </a>
        <a routerLink="/dashboard/barrera" routerLinkActive="bg-blue-100 text-blue-700 font-semibold" class="p-2 rounded hover:bg-gray-100 transition-colors">
          Barrera / Entradas
        </a>
      }

      <!-- OPCIONES DE ADMIN (solo ADMIN) -->
      @if (auth.tieneRol('ADMIN')) {
        <div class="mt-4 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">Administración</div>
        <a routerLink="/dashboard/abonados" routerLinkActive="bg-blue-100 text-blue-700 font-semibold" class="p-2 rounded hover:bg-gray-100 transition-colors">
          Gestión de Abonados
        </a>
        <a routerLink="/dashboard/tarifas" routerLinkActive="bg-blue-100 text-blue-700 font-semibold" class="p-2 rounded hover:bg-gray-100 transition-colors">
          Tarifas
        </a>
        <a routerLink="/dashboard/informes" routerLinkActive="bg-blue-100 text-blue-700 font-semibold" class="p-2 rounded hover:bg-gray-100 transition-colors">
          Informes
        </a>
      }

    </nav>
  </aside>

  <main class="flex-1 p-8 bg-gray-50">
    <router-outlet />
  </main>

</div>
