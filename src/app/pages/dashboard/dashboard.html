<div class="flex h-dvh w-full bg-gray-50">

  <!-- ASIDE: Menú lateral a pantalla completa -->
  <aside class="w-64 bg-white border-r border-gray-200 flex flex-col p-4 shadow-sm">

    <!-- Logo / Título -->
    <div class="mb-8 px-2">
      <h1 class="text-2xl font-bold text-gray-800">ParkControl</h1>
      <p class="text-sm text-gray-500 mt-1">{{ auth.usuario()?.nombre }}</p>
    </div>

    <!-- Menú dinámico por rol -->
    <nav class="flex flex-col gap-1 flex-1">

      <!-- Todos -->
      <a routerLink="/dashboard/inicio" routerLinkActive="bg-blue-50 text-blue-600 font-semibold"
         class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors">
        Inicio
      </a>

      <!-- ABONADO -->
      @if (auth.tieneRol('ABONADO')) {
        <div class="mt-4 text-xs font-bold text-gray-400 uppercase px-3 mb-1">Mi cuenta</div>
        <a routerLink="/dashboard/mis-tickets" routerLinkActive="bg-blue-50 text-blue-600 font-semibold"
           class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors">
          Mis Tickets
        </a>
        <a routerLink="/dashboard/mi-abono" routerLinkActive="bg-blue-50 text-blue-600 font-semibold"
           class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors">
          Mi Abono
        </a>
      }

      <!-- OPERADOR y ADMIN -->
      @if (auth.tieneRol('OPERADOR', 'ADMIN')) {
        <div class="mt-4 text-xs font-bold text-gray-400 uppercase px-3 mb-1">Operativa</div>
        <a routerLink="/dashboard/tickets" routerLinkActive="bg-blue-50 text-blue-600 font-semibold"
           class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors">
          Gestión de Tickets
        </a>
        <a routerLink="/dashboard/plazas" routerLinkActive="bg-blue-50 text-blue-600 font-semibold"
           class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors">
          Plazas
        </a>
      }

      <!-- Solo ADMIN -->
      @if (auth.tieneRol('ADMIN')) {
        <div class="mt-4 text-xs font-bold text-gray-400 uppercase px-3 mb-1">Administración</div>
        <a routerLink="/dashboard/informes" routerLinkActive="bg-blue-50 text-blue-600 font-semibold"
           class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors">
          Informes
        </a>
      }
    </nav>

    <!-- Botón de cerrar sesión al fondo -->
    <button (click)="auth.logout()"
            class="flex items-center cursor-pointer gap-3 px-3 py-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors mt-4">
      <svg lucideLogOut class="w-5 h-5" ></svg>
      Cerrar Sesión
    </button>

  </aside>

  <!-- MAIN: Contenido de la ruta hija -->
  <main class="flex-1 p-8 overflow-y-auto">
    <router-outlet />
  </main>

</div>
