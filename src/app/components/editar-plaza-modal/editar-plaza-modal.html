<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col">

    <div class="p-6 border-b border-gray-100">
      <h2 class="text-xl font-bold text-gray-800">Editar Plaza</h2>
    </div>

    <form (ngSubmit)="guardar()" class="p-6 flex flex-col gap-4">

      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold text-gray-600 uppercase">Tipo de plaza (no editable)</label>
        <input type="text" [value]="plaza.tipo" disabled
               class="border border-gray-200 rounded-lg p-2 bg-gray-100 text-gray-500 cursor-not-allowed uppercase">
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold text-gray-600 uppercase">Número de plaza *</label>
        <input type="text" name="numero" [(ngModel)]="numero" required
               class="border border-gray-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-brand-blue-400 uppercase">
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold text-gray-600 uppercase">Estado *</label>
        <select name="estado" [(ngModel)]="estado" required
                class="border border-gray-200 rounded-lg p-2 cursor-pointer focus:outline-none focus:ring-2 focus:ring-brand-blue-400">
          @for (est of estadosPlaza; track est) {
            <option [ngValue]="est">{{ est }}</option>
          }
        </select>
      </div>

      @if (error()) {
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded text-sm">
          {{ error() }}
        </div>
      }

      <div class="flex justify-end gap-3 mt-4">
        <button type="button" (click)="cerrar.emit()"
                class="px-4 py-2 rounded-lg cursor-pointer bg-gray-200 text-gray-700 font-bold hover:bg-gray-300 transition-colors">
          Cancelar
        </button>
        <button type="submit" [disabled]="actualizando()"
                class="px-4 py-2 rounded-lg cursor-pointer bg-brand-blue-300 text-white font-bold hover:bg-brand-blue-400 transition-colors disabled:opacity-50">
          @if (actualizando()) { Guardando... } @else { Guardar Cambios }
        </button>
      </div>
    </form>
  </div>
</div>
