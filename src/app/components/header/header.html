<header class="relative flex py-2 px-15 justify-between items-center bg-brand-gray-50">
    <div>
        <span class="text-2xl font-bold uppercase">ParkControl</span>
    </div>
    <nav class="md:flex gap-10 hidden list-none">
        <a routerLink="/">Inicio</a>
        <a routerLink="/precio">Precios</a>
        <a>Promociones</a>
        <a>Abonados</a>
    </nav>
    <div>
        <button class="md:flex gap-2 items-center cursor-pointer bg-brand-blue-200 px-4 py-2 rounded-lg text-white uppercase hidden">
            Acceder
            <svg lucideArrowUpRight class="size-5"></svg>
        </button>
        <svg (click)="openMenu()" lucideMenu class="flex md:hidden size-6 cursor-pointer"></svg>
        @if (menu()) {
          <div class="absolute top-full left-0 w-full bg-white shadow-md md:hidden flex flex-col p-5 gap-4 border-t border-brand-gray-200 z-50">
            <a routerLink="/" (click)="menu.set(false)" class="text-lg font-medium text-brand-gray-600 hover:text-primary">Inicio</a>
            <a routerLink="/precio" (click)="menu.set(false)" class="text-lg font-medium text-brand-gray-600 hover:text-primary">Precios</a>
            <a href="#" class="text-lg font-medium text-brand-gray-600 hover:text-primary">Promociones</a>
            <a href="#" class="text-lg font-medium text-brand-gray-600 hover:text-primary">Abonados</a>

            <button class="flex w-full justify-center gap-2 items-center cursor-pointer bg-brand-blue-200 px-4 py-2 rounded-lg text-white uppercase font-semibold mt-2">
              Acceder
              <svg lucideArrowUpRight class="size-4"></svg>
            </button>
          </div>
        }
    </div>
</header>
