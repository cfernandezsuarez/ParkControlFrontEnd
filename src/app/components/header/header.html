<header class="relative flex py-4 px-15 border-b-1 border-brand-gray-200 justify-between items-center bg-brand-gray-50">
    <div routerLink="/" class="flex items-center cursor-pointer gap-2">
      <img src="/Logo.png" class="size-10" draggable="false">
      <span class="text-2xl font-bold uppercase">ParkControl</span>
    </div>
    <nav class="lg:flex gap-10 hidden list-none">
      <a routerLink="/" routerLinkActive="font-bold" [routerLinkActiveOptions]="{exact: true}" class="hover:underline transition-all">Inicio</a>
      <a routerLink="/precio" routerLinkActive="font-bold" class="hover:underline transition-all">Precios</a>
      <a routerLink="/promociones" routerLinkActive="font-bold" class="hover:underline transition-all">Promociones</a>
      <a routerLink="/abonados" routerLinkActive="font-bold" class="hover:underline transition-all">Abonados</a>
    </nav>
    <div>
        <button [routerLink]="rutaDestino" class="lg:flex gap-2 items-center cursor-pointer bg-brand-blue-200 px-4 py-2 rounded-lg text-white uppercase hidden hover:bg-brand-blue-300 transition-all">
          {{ auth.autenticado() ? 'Acceder' : 'Login' }}
          <svg lucideArrowUpRight class="size-5"></svg>
        </button>
        <svg (click)="openMenu()" lucideMenu class="flex lg:hidden size-6 cursor-pointer"></svg>
        @if (menu()) {
          <div class="absolute top-full left-0 w-full bg-white shadow-md md:hidden flex flex-col p-5 gap-4 border-t border-brand-gray-200 z-50">
            <a routerLink="/" routerLinkActive="font-bold" [routerLinkActiveOptions]="{exact: true}" (click)="menu.set(false)" class="text-lg font-medium text-brand-gray-600 hover:text-primary">Inicio</a>
            <a routerLink="/precio" routerLinkActive="font-bold" (click)="menu.set(false)" class="text-lg font-medium text-brand-gray-600 hover:text-primary">Precios</a>
            <a routerLink="/promociones" routerLinkActive="font-bold" (click)="menu.set(false)" class="text-lg font-medium text-brand-gray-600 hover:text-primary">Promociones</a>
            <a routerLink="/abonados" routerLinkActive="font-bold" (click)="menu.set(false)" class="text-lg font-medium text-brand-gray-600 hover:text-primary">Abonados</a>

            <button [routerLink]="rutaDestino" class="flex w-full justify-center gap-2 items-center cursor-pointer bg-brand-blue-200 px-4 py-2 rounded-lg text-white uppercase font-semibold mt-2 hover:bg-brand-blue-300 transition-all">
              {{ auth.autenticado() ? 'Acceder' : 'Login' }}
              <svg lucideArrowUpRight class="size-4"></svg>
            </button>
          </div>
        }
    </div>
</header>
