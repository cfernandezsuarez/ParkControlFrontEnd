<header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
  <div class="flex items-center gap-6">
    <span class="font-bold text-xl">ParkControl</span>

    <nav class="flex gap-4">
      <!-- Opciones para ADMIN y OPERADOR -->
      @if (auth.tieneRol('ADMIN', 'OPERADOR')) {
        <a routerLink="/dashboard" class="hover:text-blue-600">Panel de Control</a>
        <a routerLink="/tickets" class="hover:text-blue-600">Gestión Tickets</a>
        <a routerLink="/plazas" class="hover:text-blue-600">Plazas</a>
      }

      <!-- Opciones para ABONADO -->
      @if (auth.tieneRol('ABONADO')) {
        <a routerLink="/mis-tickets" class="hover:text-blue-600">Mis Tickets</a>
        <a routerLink="/mi-abono" class="hover:text-blue-600">Mi Abono</a>
      }

      <!-- Opciones solo para ADMIN -->
      @if (auth.tieneRol('ADMIN')) {
        <a routerLink="/informes" class="hover:text-blue-600">Informes</a>
        <a routerLink="/usuarios" class="hover:text-blue-600">Usuarios</a>
      }
    </nav>
  </div>

  <div class="flex items-center gap-4">
        <span class="text-sm text-gray-600">
          {{ auth.usuario()?.nombre }}
          <span class="text-xs bg-gray-200 px-2 py-1 rounded">{{ auth.usuario()?.rol }}</span>
        </span>
    <button (click)="auth.logout()" class="text-red-500 hover:text-red-700 font-medium">Salir</button>
  </div>
</header>
