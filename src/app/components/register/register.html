<div class="flex flex-col p-8 gap-3 bg-white rounded-2xl shadow-lg w-full max-w-md">
  <span class="text-xs text-brand-blue-400 font-bold uppercase">Bienvenido de nuevo</span>
  <h1 class="text-3xl font-bold">Registrarme</h1>
  <p class="text-brand-gray-400 text-sm">Accede a tu cuenta para consultar tus estancias y tu abono.</p>
  <form (ngSubmit)="registrar()" class="flex flex-col gap-4">
    <div class="flex flex-col gap-1">
      <label for="email">Nombre</label>
      <input #Inombre [(ngModel)]="nombre" name="nombre" type="email" id="email" placeholder="Correo electrónico" class="border border-brand-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-brand-blue-200">
    </div>
    <div class="flex flex-col gap-1">
      <label for="password">Contraseña</label>
      <input #passwd [(ngModel)]="password" name="password" type="password" id="password" placeholder="Contraseña" class="border border-brand-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-brand-blue-200">
    </div>
    <div class="flex flex-col gap-1">
      <label for="passwordConfirm">Confirmar contraseña</label>
      <input #passwdConfirm [(ngModel)]="confirmPassword" name="passwordConfirm" type="password" id="password" placeholder="Contraseña" class="border border-brand-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-brand-blue-200">
    </div>
    <span class="text-red-600">{{ error() !== null ? error() : '' }}</span>
    <button type="submit" class="bg-brand-blue-200 text-white py-3 cursor-pointer rounded-lg hover:bg-brand-blue-300 transition-all">
      @if (!cargando()) {
        Registrarme
      } @else {
        Registrando...
      }
    </button>
    <div class="flex justify-between">
      <span>¿No tienes cuenta?</span>
      <span (click)="irAlLogin.emit()" class="cursor-pointer text-brand-blue-300 underline hover:no-underline">Iniciar Sesión</span>
    </div>
  </form>
</div>
