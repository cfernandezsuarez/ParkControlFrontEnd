<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col">

    <div class="p-6 border-b border-gray-100">
      <h2 class="text-xl font-bold text-gray-800">{{ titulo }}</h2>
    </div>

    <div class="p-6">
      <p class="text-gray-600">{{ mensaje }}</p>
    </div>

    <div class="p-4 bg-gray-50 flex justify-end gap-3">
      <button
        (click)="cancelar.emit()"
        class="px-4 py-2 rounded-lg cursor-pointer bg-gray-200 text-gray-700 font-bold hover:bg-gray-300 transition-colors"
      >
        {{ textoCancelar }}
      </button>
      <button
        (click)="confirmar.emit()"
        class="px-4 py-2 rounded-lg cursor-pointer bg-red-500 text-white font-bold hover:bg-red-600 transition-colors"
      >
        {{ textoConfirmar }}
      </button>
    </div>

  </div>
</div>
