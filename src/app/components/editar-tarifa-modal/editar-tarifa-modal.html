<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-6/12 overflow-hidden flex flex-col">

    <div class="p-6 border-b border-gray-100">
      <h2 class="text-xl font-bold text-gray-800">Editar Tarifa</h2>
      <p class="text-sm text-gray-500 mt-1">Modifica los datos de la tarifa y guarda los cambios.</p>
    </div>

    <form (ngSubmit)="guardar()" class="flex flex-col p-6 gap-4">

      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold text-gray-600 uppercase">Nombre *</label>
        <input
          type="text"
          name="nombre"
          [(ngModel)]="nombre"
          required
          class="border border-gray-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-brand-blue-300"
        >
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold text-gray-600 uppercase">Precio (€/min) *</label>
        <input
          type="number"
          step="0.01"
          name="precio"
          [(ngModel)]="precio"
          required
          class="border border-gray-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-brand-blue-300"
        >
      </div>

      <div class="flex gap-4">
        <div class="flex-1 flex flex-col gap-1">
          <label class="text-xs font-bold text-gray-600 uppercase">Tope máximo (min) *</label>
          <input
            type="number"
            name="topeMaximo"
            [(ngModel)]="topeMaximo"
            required
            class="border border-gray-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-brand-blue-300"
          >
        </div>

        <div class="flex-1 flex flex-col gap-1">
          <label class="text-xs font-bold text-gray-600 uppercase">Cortesía (min) *</label>
          <input
            type="number"
            name="minCortesia"
            [(ngModel)]="minCortesia"
            required
            class="border border-gray-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-brand-blue-300"
          >
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold text-gray-600 uppercase">Vigente desde *</label>
        <input
          type="datetime-local"
          name="fecha"
          [(ngModel)]="fecha"
          required
          class="border border-gray-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-brand-blue-300"
        >
      </div>

      @if (error()) {
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded text-sm">
          {{ error() }}
        </div>
      }

      <div class="flex justify-end gap-3 mt-4">
        <button
          type="button"
          (click)="cerrar.emit()"
          class="px-4 py-2 rounded-lg cursor-pointer bg-gray-200 text-gray-700 font-bold hover:bg-gray-300 transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="actualizando()"
          class="px-4 py-2 rounded-lg cursor-pointer bg-brand-blue-300 text-white font-bold hover:bg-brand-blue-400 transition-colors disabled:opacity-50"
        >
          @if (actualizando()) { Guardando... } @else { Guardar Cambios }
        </button>
      </div>
    </form>

  </div>
</div>
